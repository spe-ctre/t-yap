services:
  postgres:
    image: postgres:15
    container_name: tyap_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: tyap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tyap_redis
    restart: always
    ports:
      - "6379:6379"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: tyap_pooler
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_HOST=postgres
      - DB_NAME=tyap_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
    ports:
      - "6432:5432"
    depends_on:
      - postgres

volumes:
  postgres_data: